# .github/workflows/build-release.yml
name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*' # Trigger deployment on Semantic Versioning tags (e.g., v1.0.0)

env:
  REGISTRY: ghcr.io
  # Maps to github.repository (e.g., kartoffelbauer/web-aaronsoft)
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    name: Build & Push Container Image
    runs-on: ubuntu-latest

    # Explicit permissions required for pushing to GitHub Container Registry
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Sets up QEMU to allow for multi-architecture builds if necessary
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Initializes Docker Buildx to enable advanced caching and multi-platform compilation
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticates the workflow with the GitHub Container Registry
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dynamically generates tags and labels based on branch or Git tags
      # - 'latest' tag applied automatically on main branch
      # - Semantic version tag applied automatically on git tag events
      # - Git SHA appended for unique tracking
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      # Builds the multi-stage Dockerfile and conditionally pushes to GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          # Push the image on tags creation
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Leverages GitHub Actions caching API to significantly speed up build steps
          cache-from: type=gha
          cache-to: type=gha,mode=max