# .github/workflows/build-release.yml
name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*' # Trigger deployment on Semantic Versioning tags (e.g., v1.0.0)

env:
  REGISTRY: ghcr.io

jobs:
  # ==========================================
  # JOB 1: Docker Build & Push
  # ==========================================
  build-and-push-image:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        id: string
        uses: ASzc/change-string-case-action@v6
        with:
          string: ${{ github.repository }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.string.outputs.lowercase }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # JOB 2: Create GitHub Release (For the ZIP download)
  # ==========================================
  create-release:
    name: Package Compiled Astro Site
    # Only run this job if a version tag (v1.0.0) is pushed
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build-and-push-image
    permissions:
      contents: write # Needed to create the GitHub Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Speeds up npm ci

      - name: Build Astro Site
        run: |
          npm ci
          npm run build

      - name: Package 'dist' directory
        run: |
          # 3. FIX: We zip the compiled 'dist' folder, NOT the Astro source code
          # This ensures users downloading the zip just get pure HTML/CSS
          cd dist
          zip -r ../website-compiled.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: website-compiled.zip
          generate_release_notes: true
          body: |
            ### 🚀 Docker Deployment
            ```bash
            docker run -d -p 8080:8080 ${{ env.REGISTRY }}/${{ github.repository_owner }}/web-aaronsoft:${{ github.ref_name }}
            ```
            ### 📄 Manual Deployment
            Download `website-compiled.zip` below and serve the contents with any web server (Nginx, Apache, etc.).
